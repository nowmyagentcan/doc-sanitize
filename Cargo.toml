[package]
name = "doc-sanitize"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Find and remove hidden data in PDF, Word, Excel and PowerPoint files"
repository = "https://github.com/nowmyagentcan/doc-sanitize"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hayro = "=0.9.0"
lopdf = { version = "=0.46.0", default-features = false }
quick-xml = "=0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Tests parse and render whole documents, which takes seconds without optimisation: our code
# gets a light pass, dependencies a full one.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
