<title>Find and remove hidden data</title>

<style>
:root { --bg:#fafaf9; --fg:#1c1b1a; --muted:#6b6966; --line:#e7e5e2; --field:#f2f1ef; --accent:#0f7b4a; --danger:#b42318; --r:8px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#121110; --fg:#ecebe9; --muted:#9a9894; --line:#2a2826; --field:#1b1a19; --accent:#5fd38d; --danger:#f97066; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 28px 16px 20px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
p, h2, pre, ul { margin: 0; }
ul { padding: 0; list-style: none; }
svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.visual { width: auto; height: 64px; justify-self: center; color: var(--muted); }
form { display: grid; gap: 12px; }
#zone { display: grid; gap: 2px; place-content: center; min-height: 96px; padding: 16px; font: inherit; color: var(--fg); text-align: center;
  white-space: normal; background: none; border: 2px dashed var(--line); border-radius: var(--r); cursor: pointer; }
#zone:hover, #zone.over { border-color: var(--accent); background: var(--field); }
#chosen { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input { width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); }
input[type=checkbox] { width: 18px; min-height: 18px; margin: 0; accent-color: var(--accent); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.check { display: flex; align-items: center; gap: 8px; align-self: end; min-height: 40px; font-size: 15px; color: var(--fg); }
summary { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; list-style: none; border-radius: var(--r); }
summary::-webkit-details-marker { display: none; }
details[open] > summary svg { transform: rotate(90deg); }
button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; font: inherit; font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; }
button:active { transform: translateY(1px); }
button:disabled { opacity: .55; cursor: default; }
.go { justify-self: center; min-height: 40px; padding: 8px 40px; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--accent); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: grid; gap: 16px; min-height: 88px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); align-content: start; }
.muted { color: var(--muted); }
.bar { width: 100%; height: 3px; overflow: hidden; border-radius: var(--r); }
.bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { width: 100%; animation: none; } }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
.sum { font-size: 17px; font-weight: 600; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.file { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
h2 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
h2 span { font-weight: 400; color: var(--muted); }
.found { color: var(--danger); font-weight: 600; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 12px; background: var(--field); border-radius: var(--r); }
.id { font: 600 14px/1.5 var(--mono); }
.row label { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--fg); }
.finds { grid-column: 1 / -1; display: grid; gap: 2px; font-size: 14px; }
.where { color: var(--muted); }
.nw { white-space: nowrap; }
pre { margin: 2px 0 4px; padding: 2px 0 2px 10px; font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--line); }
.finds summary { font-size: 13px; }
.note, .err { display: flex; gap: 8px; align-items: baseline; }
.note svg, .err svg { position: relative; top: 3px; }
.note code { font: 14px var(--mono); white-space: nowrap; }
.err { color: var(--danger); font-weight: 600; }
.hint { padding-left: 24px; }
.cleaned { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px; font-size: 14px; }
.kv span:first-child { color: var(--muted); }
footer { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 13px; }
footer a { display: inline-flex; color: var(--muted); border-radius: 4px; }
footer a:hover { color: var(--fg); }
footer svg { width: 18px; height: 18px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; gap: 0; } }

<main>
  <h1>Find and remove hidden data in PDF, Word, Excel and PowerPoint files.</h1>

  <form>

    <input type="file" id="files" multiple hidden accept=".pdf,.docx,.docm,.dotx,.dotm,.xlsx,.xlsm,.xltx,.xltm,.pptx,.pptm,.potx,.potm,.ppsx,.ppsm">
    <details>

      <div class="opts">

          <input id="password" type="password" autocomplete="off">

<script>
const $ = s => document.querySelector(s);
const form = $("form"), zone = $("#zone"), input = $("#files"), out = $("#out");
const icon = d => `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${d}"/></svg>`;
const COPY = icon("M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z");
const SAVE = icon("M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z");
const WARN = icon("M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z");
const FAIL = icon("M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z");
const DONE = icon("M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z");
const INFO = icon("M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z");
const PICTURE = icon("M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z");

async function api(path, file, options) {
  // Header values must be Latin-1, so non-ASCII in the password goes as JSON \u escapes.
  const json = JSON.stringify(options).replace(/[\u007f-\uffff]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
  const r = await fetch(path, { method: "POST", headers: { "X-File-Name": encodeURIComponent(file.name), "X-Options": json }, body: file });
  if (path === "/api/clean" && r.ok) return { ...JSON.parse(decodeURIComponent(r.headers.get("X-Result"))), blob: await r.blob() };
  return r.json();
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const button = (svg, label) => { const b = el("button"); b.type = "button"; b.innerHTML = svg; b.append(label); return b; };
const line = (cls, svg, ...parts) => { const p = el("p", cls); p.innerHTML = svg; p.append(el("span")); p.lastChild.append(...parts); return p; };
const code = t => el("code", null, t);
const plural = (n, w) => `${n.toLocaleString("en")} ${w}${n === 1 ? "" : "s"}`;
const qty = (n, unit) => `${n.toLocaleString("en")} ${n !== 1 ? unit : unit === "people" ? "person" : unit.slice(0, -1)}`;
const removedText = c => Object.entries(Object.groupBy(c.removed, r => r.check)).map(([id, rs]) => `${id} (${rs.map(r => qty(r.count, r.unit)).join(", ")})`).join(", ");
const cap = s => s[0].toUpperCase() + s.slice(1);
const KIND = { pdf: "PDF", docx: "Word", xlsx: "Excel", pptx: "PowerPoint" };
const ALWAYS = ["signatures", "old-revisions"];
const where = w => [w.page && `page ${w.page}`, w.slide && `slide ${w.slide}`, w.sheet ? `sheet ${w.sheet}` : w.sheet_index && `sheet ${w.sheet_index}`,
  w.cells, w.revision && `revision ${w.revision}`, w.object && `object ${w.object}`, w.field, !(w.page || w.slide || w.sheet_index) && w.part].filter(Boolean).join(", ");
const findingText = f => (where(f.where) ? `${where(f.where)}: ` : "") + f.detail;
const counts = f => ({ found: f.checks.filter(c => c.status === "found"), incomplete: f.checks.filter(c => c.status === "incomplete"), none: f.checks.filter(c => c.status === "none_found") });

function status(f) {
  const { found, incomplete } = counts(f);
  if (found.length) return `found ${found.length} ${found.length === 1 ? "kind" : "kinds"} of hidden data`;
  return incomplete.length ? `${f.checks.length} checks, ${incomplete.length} incomplete` : `nothing found by ${f.checks.length} checks`;
}

function summary(files) {
  const failed = files.filter(f => f.error).length;
  if (files.length === 1) return failed ? "Couldn't check this file" : cap(status(files[0]));
  return `${files.filter(f => f.status === "found").length} of ${files.length} files have hidden data` + (failed ? ` · ${failed} failed` : "");
}

// The report is the command line's text output, so it reads the same wherever it is pasted.
const arg = n => /[\s"'$`\\]/.test(n) ? `"${n.replace(/["\\$`]/g, "\\$&")}"` : n;
const errorLines = e => {
  const messages = e.message.split("\n"), hints = e.hint.split("\n");
  return messages.length > 1 && messages.length === hints.length ? messages.flatMap((m, i) => [`✗ ${m}`, `  ${hints[i]}`]) : [`✗ ${e.message}`, `  ${e.hint}`];
};
function reportLines(f) {
  if (f.error) return errorLines(f.error);
  const { found, incomplete, none } = counts(f), w = Math.max(0, ...[...found, ...incomplete].map(c => c.id.length)) + 2, L = [`${f.path}  ${status(f)}`];
  for (const c of found) {
    const fs = f.findings.filter(x => x.check === c.id);
    L.push(`  ✗ ${c.id.padEnd(w)}${fs.map(findingText).join("; ")}`);
    for (const x of fs) if (x.value != null) L.push(`    ${" ".repeat(w)}${where(x.where) ? where(x.where) + ": " : ""}${x.value}`);
  }
  for (const c of incomplete) L.push(`  ! ${c.id.padEnd(w)}${c.note}`);
  if (none.length) L.push(`  ✓ ${plural(none.length, "check")} found nothing: ${none.map(c => c.id).join(", ")}`);
  for (const x of f.warnings) L.push(`  ! ${x.message}`);
  if (f.clean) L.push(...cleanLines(f));
  else if (found.length) L.push(`  Remove it: doc-sanitize clean ${arg(f.path)}`);
  return L;
}

function cleanLines(f) {
  const c = f.clean;
  if (c.status === "not_cleaned") return errorLines(c.error).map(l => "  " + l);
  return [`  ${f.path} → ${c.output}`, ...(c.removed.length ? [`  removed  ${removedText(c)}`] : []),
    ...(c.kept.length ? [`  kept     ${c.kept.join(", ")}`] : []), ...c.changes.map((x, i) => `  ${i ? "         " : "changed  "}${x.detail}`),
    ...(c.warnings || []).map(x => `  ! ${x.message}`), `  ${c.status === "cleaned" ? "✓" : "!"} ${recheck(c)}`,
    ...c.recheck.checks.filter(x => x.status === "incomplete").map(x => `    ! ${x.id}  ${x.note}`)];
}

function recheck(c) {
  const n = c.recheck.checks.length, inc = c.recheck.checks.filter(x => x.status === "incomplete").length;
  return `re-checked: ${plural(n, "check")}, ${inc ? `${inc} incomplete` : "nothing left"}` + (c.kept.length ? ` (${c.kept.length} kept)` : "");
}

const report = files => files.map(f => reportLines(f).join("\n")).join("\n\n") + (files.length > 1 ? `\n\n${summary(files)}` : "") + "\n";

// The page has no --keep flag: its Remove ticks do the same job.
function failure(box, e) {
  const hints = (e.hint || "").split("\n");
  for (const [i, message] of e.message.split("\n").entries()) {
    box.append(line("err", FAIL, message));
    if (hints[i]) box.append(el("p", "hint", hints[i].replace("Pass it with --password.", "Open Options and enter the password, then press Check.").replace(/run clean again with --keep ([a-z-]+)/, "untick $1 and save again")));
  }
}

function row(f, c) {
  const li = el("li", "row"), fs = f.findings.filter(x => x.check === c.id), list = el("div", "finds"), more = el("details");
  const box = el("label"), tick = el("input");
  tick.type = "checkbox"; tick.checked = true; tick.dataset.check = c.id; tick.disabled = ALWAYS.includes(c.id);
  tick.setAttribute("aria-label", tick.disabled ? `${c.id} is always removed` : `Remove ${c.id}`);
  box.append(tick, tick.disabled ? "Always removed" : "Remove");
  for (const [i, x] of fs.entries()) {
    const p = el("p");
    if (where(x.where)) p.append(el("span", "where", where(x.where)), " ");
    p.append(x.detail);
    (i < 5 ? list : more).append(p);
    if (x.value != null) (i < 5 ? list : more).append(el("pre", null, x.value));
  }
  if (fs.length > 5) { more.prepend(el("summary", null, `${fs.length - 5} more`)); list.append(more); }
  li.append(el("p", "id", c.id), box, list);
  return li;
}

function fileBlock(f) {
  const box = el("article", "file"), h = el("h2", null, f.path);
  if (f.format) h.append(" ", el("span", null, KIND[f.format] + (f.variant !== f.format ? ` · .${f.variant}` : "")));
  box.append(h);
  if (f.error) { failure(box, f.error); return box; }
  const { found, incomplete, none } = counts(f);
  if (results.length > 1 && f.status !== "none_found") box.append(el("p", found.length ? "found" : "", cap(status(f))));
  if (found.length) { const ul = el("ul", "rows"); ul.append(...found.map(c => row(f, c))); box.append(ul); }
  if (none.length) box.append(line("note muted", DONE, `${plural(none.length, "check")} found nothing: `, ...none.flatMap((c, i) => [i ? ", " : "", el("span", "nw", c.id)])));
  for (const c of incomplete) box.append(line("note", WARN, code(c.id), " " + c.note));
  for (const w of f.warnings) box.append(line("note", WARN, w.message));
  if (found.length) {
    const acts = el("div", "acts"), save = button(SAVE, "Save cleaned copy"), slot = el("div");
    slot.style.display = "contents";
    save.addEventListener("click", () => clean(f, box, save, slot));
    acts.append(save);
    box.append(acts, slot);
  }
  return box;
}

function cleanedBlock(f) {
  const c = f.clean, box = el("div", "cleaned"), kv = (k, v) => { const d = el("p", "kv"); d.append(el("span", null, k), el("span", null, v)); return d; };
  if (c.status === "not_cleaned") { failure(box, c.error); return box; }
  const head = el("div", "head"), again = button(SAVE, "Save again");
  again.addEventListener("click", () => download(c));
  head.append(line("note", DONE, "Cleaned copy: ", el("strong", null, c.output)), again);
  box.append(head);
  if (c.removed.length) box.append(kv("Removed", removedText(c)));
  if (c.kept.length) box.append(kv("Kept", c.kept.join(", ")));
  for (const x of c.changes) box.append(line("note", x.code === "pages_rasterised" ? PICTURE : INFO, x.detail));
  for (const w of c.warnings || []) box.append(line("note", WARN, w.message));
  box.append(line("note muted", c.status === "cleaned" ? DONE : WARN, cap(recheck(c))));
  for (const x of c.recheck.checks.filter(x => x.status === "incomplete")) box.append(line("note", WARN, code(x.id), " " + x.note));
  return box;
}

function download(c) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(c.blob);
  a.download = c.output;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function clean(f, box, save, slot) {
  const keep = [...box.querySelectorAll("[data-check]")].filter(t => !t.checked).map(t => t.dataset.check);
  save.disabled = true;
  save.lastChild.textContent = "Cleaning…";
  const wait = setTimeout(() => slot.replaceChildren(el("div", "bar"), el("p", "muted", `Cleaning ${f.path}`)), 150);
  let c;
  try { c = await api("/api/clean", f.file, { ...options(), keep }); }
  catch { c = { error: unreachable }; }
  clearTimeout(wait);
  save.disabled = false;
  save.lastChild.textContent = "Save cleaned copy";
  if (!c.status) { const d = el("div", "cleaned"); failure(d, c.error); slot.replaceChildren(d); return; }
  f.clean = c;
  slot.replaceChildren(cleanedBlock(f));
  if (c.blob) download(c);
}

const unreachable = { message: "Can't reach doc-sanitize.", hint: "Start it again with: doc-sanitize ui" };
const options = () => $("#password").value ? { password: $("#password").value } : {};

// The page server takes uploads up to 256 MiB, the same limit as the command line.
const LIMIT = 256 * 2 ** 20;
const tooBig = file => ({ path: file.name, checks: [], error: { code: "too_large", message: `${file.name} is too large to check (the file is over 256 MiB).`, hint: "Check a smaller copy, or split the file." } });

let chosen = [], results = [], latest = 0;
const copyAll = button(COPY, "Copy report");

function choose(files) {
  if (!files.length) return;
  chosen = [...files];
  $("#chosen").textContent = chosen.length === 1 ? chosen[0].name : `${chosen.length} files: ${chosen.slice(0, 2).map(f => f.name).join(", ")}${chosen.length > 2 ? ` and ${chosen.length - 2} more` : ""}`;
  form.requestSubmit();
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const run = ++latest;
  results = [];
  out.removeAttribute("aria-busy");
  if (!chosen.length) {
    out.replaceChildren();
    failure(out, { message: "No file chosen.", hint: "Drop a PDF, Word, Excel or PowerPoint file above, or click the box to choose one." });
    return;
  }
  const opts = { ...options(), ...($("#values").checked ? { show_values: true } : {}) };
  const head = el("div", "head");
  out.replaceChildren(head);
  for (const [i, file] of chosen.entries()) {
    const wait = setTimeout(() => {
      out.setAttribute("aria-busy", "true");
      head.replaceChildren(el("div", "bar"), el("p", "muted", `Checking ${i + 1} of ${chosen.length} · ${file.name}`));
      head.firstChild.setAttribute("role", "progressbar");
      head.firstChild.setAttribute("aria-label", "Checking");
    }, 150);
    let f;
    try { f = file.size > LIMIT ? tooBig(file) : await api("/api/check", file, opts); }
    catch { f = { error: unreachable }; }
    clearTimeout(wait);
    if (run !== latest) return;
    if (!f.checks) { out.removeAttribute("aria-busy"); out.replaceChildren(); failure(out, f.error); return; }
    f.file = file;
    results.push(f);
  }
  out.removeAttribute("aria-busy");
  out.append(...results.map(fileBlock));
  head.replaceChildren(el("p", "sum", summary(results)), copyAll);
});

copyAll.addEventListener("click", async () => {
  const label = copyAll.lastChild;
  try { await navigator.clipboard.writeText(report(results)); label.textContent = "Copied"; }
  catch { label.textContent = "Can't copy"; }
  setTimeout(() => { label.textContent = "Copy report"; }, 1500);
});

zone.addEventListener("click", () => input.click());
input.addEventListener("change", () => { choose(input.files); input.value = ""; });
document.addEventListener("dragover", ev => { ev.preventDefault(); zone.classList.add("over"); });
document.addEventListener("dragleave", ev => { if (!ev.relatedTarget) zone.classList.remove("over"); });
document.addEventListener("drop", ev => { ev.preventDefault(); zone.classList.remove("over"); choose(ev.dataTransfer.files); });
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "o") { ev.preventDefault(); input.click(); }
  else if (ev.key === "Enter" && document.activeElement === document.body) form.requestSubmit();
});
</script>
</body>
</html>
